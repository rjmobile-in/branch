<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RJ Mobile | Branches & Connect</title>
  <meta name="description" content="Find the nearest RJ Mobile branch, call or WhatsApp us, and follow us online." />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('rj_theme'); } catch (e) {}
      if (t === 'light') document.documentElement.classList.add('light-theme');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070707; --surface: #121212; --line: #262626; --chip: #1a1a1a; --hover: #181612;
      --text: #ffffff; --soft: #a1a1aa;
      --gold: #d4af37; --gold-text: #e6c35a; --on-gold: #151100; --gold-soft: rgba(212, 175, 55, 0.12);
      --ok: #34d399; --ok-soft: rgba(52, 211, 153, 0.13); --bad: #f87171;
    }
    html.light-theme {
      --bg: #faf8f3; --surface: #ffffff; --line: #e8e3d5; --chip: #f3efe3; --hover: #fffaf0;
      --text: #16130a; --soft: #686353;
      --gold: #d4af37; --gold-text: #8a6a00; --on-gold: #151100; --gold-soft: rgba(212, 175, 55, 0.16);
      --ok: #047857; --ok-soft: rgba(4, 120, 87, 0.1); --bad: #b91c1c;
    }
    html { -webkit-font-smoothing: antialiased; }
    body { font-family: 'Manrope', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px 16px 64px; line-height: 1.45; transition: background-color .3s, color .3s; }
    .wrap { max-width: 560px; margin: 0 auto; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    button { font: inherit; color: inherit; }

    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 12px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px; }
    .logo { width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 2px solid var(--gold); overflow: hidden; display: grid; place-items: center; }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    .icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--soft); display: grid; place-items: center; cursor: pointer; }
    .icon-btn:hover { color: var(--gold-text); border-color: var(--gold); }
    .icon-btn .sun { display: none; } html.light-theme .icon-btn .sun { display: block; } html.light-theme .icon-btn .moon { display: none; }

    h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(30px, 8.5vw, 42px); line-height: 1.08; letter-spacing: -0.02em; }
    .lead { color: var(--soft); font-size: 16px; margin: 10px 0 22px; max-width: 430px; }

    .tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--chip); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 22px; }
    .tabs::before { content: ''; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 6px); background: var(--gold); border-radius: 12px; box-shadow: 0 4px 14px rgba(212, 175, 55, .35); transition: transform .45s cubic-bezier(.34, 1.4, .64, 1); }
    .tabs[data-active='connect']::before { transform: translateX(calc(100% + 4px)); }
    .tab { position: relative; z-index: 1; border: 0; background: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 15px; color: var(--soft); cursor: pointer; transition: color .3s, transform .15s; }
    .tab:active { transform: scale(.96); }
    .tab[aria-selected="true"] { color: var(--on-gold); }

    .primary { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--gold); color: var(--on-gold); border: 0; border-radius: 16px; padding: 17px 20px; font-weight: 800; font-size: 17px; cursor: pointer; transition: transform .15s, filter .15s; }
    .primary:hover { filter: brightness(1.07); } .primary:active { transform: scale(.98); } .primary:disabled { opacity: .7; cursor: progress; }
    .status { min-height: 22px; margin-top: 10px; font-size: 14px; color: var(--soft); }
    .status.error { color: var(--bad); }
    .search { width: 100%; margin: 14px 0 12px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 16px; }
    .search::placeholder { color: var(--soft); }

    .cities { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
    .city-chip { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--soft); font-weight: 700; font-size: 14px; cursor: pointer; transition: transform .15s, border-color .2s, background-color .25s, color .25s; }
    .city-chip em { font-style: normal; font-size: 12px; opacity: .8; }
    .city-chip:hover { border-color: var(--gold); } .city-chip:active { transform: scale(.95); }
    .city-chip[aria-pressed='true'] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
    .list { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; list-style: none; }
    .list li + li { border-top: 1px solid var(--line); }
    .branch { padding: 18px 20px; }
    .branch.nearest { background: var(--gold-soft); box-shadow: inset 4px 0 0 var(--gold); }
    .branch.soon { opacity: .7; }
    .b-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .tag { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 800; color: var(--ok); }
    .name { font-weight: 800; font-size: 17px; }
    .addr { color: var(--soft); font-size: 14px; margin-top: 3px; }
    .dist { font-weight: 800; font-size: 15px; white-space: nowrap; }
    .hours { margin-top: 8px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; color: var(--soft); }
    .hours::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--soft); }
    .hours.open { color: var(--ok); } .hours.open::before { background: var(--ok); }
    .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .pill { flex: 1 1 auto; min-width: 92px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--chip); color: var(--text); text-decoration: none; font-weight: 700; font-size: 14px; }
    .pill:hover { border-color: var(--gold); }
    .pill.main { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
    .pill svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
    .pill.stroke svg { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .empty { display: none; padding: 26px 20px; text-align: center; color: var(--soft); font-size: 15px; }
    .soon-note { color: var(--soft); font-size: 14px; margin-top: 4px; }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .progress { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--soft); }
    .bar { flex: 1; height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
    .select { width: 100%; padding: 15px 44px 15px 16px; border-radius: 14px; background: var(--chip); color: var(--text); border: 1px solid var(--line); font: inherit; font-weight: 700; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 14px center; background-size: 18px; }
    .select option, .select optgroup { background: var(--surface); color: var(--text); } .select option:disabled { color: var(--soft); }
    .action-btn { text-decoration: none; color: inherit; background: var(--chip); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: space-between; text-align: left; -webkit-tap-highlight-color: transparent; }
    .action-btn:hover { border-color: var(--gold); } .action-btn:active { transform: scale(.98); }
    .btn-content { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .btn-icon { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; color: #fff; }
    .btn-icon svg { width: 22px; height: 22px; fill: currentColor; }
    .icon-map { background: #F5B400; color: #151100; } .icon-ig { background: linear-gradient(45deg, #f09433, #dc2743 55%, #bc1888); } .icon-yt { background: #FF0000; } .icon-fb { background: #1877F2; } .icon-wa { background: #25D366; }
    .btn-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .btn-title { font-size: 15px; font-weight: 800; } .btn-sub { font-size: 12.5px; color: var(--soft); font-weight: 600; }
    .status-icon { color: var(--soft); font-weight: 800; padding-left: 8px; }
    .action-btn.done { background: var(--ok-soft); border-color: var(--ok); }
    .action-btn.done .btn-title, .action-btn.done .btn-sub, .action-btn.done .status-icon { color: var(--ok); }
    .divider { height: 1px; background: var(--line); }
    #manual { display: none; flex-direction: column; gap: 10px; background: var(--chip); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    #manual p { font-size: 13px; color: var(--soft); }
    #manual textarea { width: 100%; min-height: 96px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; font-size: 16px; resize: none; }
    .soon-card { display: none; padding: 16px; border-radius: 14px; background: var(--chip); border: 1px dashed var(--line); text-align: center; }
    .soon-card strong { display: block; margin-bottom: 4px; } .soon-card span { font-size: 13px; color: var(--soft); }
    .link-btn { align-self: flex-end; background: none; border: 0; color: var(--soft); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 4px 0; }
    #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--gold); color: var(--on-gold); font-size: 14px; font-weight: 800; padding: 13px 22px; border-radius: 50px; opacity: 0; transition: all .3s; pointer-events: none; z-index: 100; max-width: calc(100vw - 32px); text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,.4); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    footer { margin-top: 30px; text-align: center; color: var(--soft); font-size: 14px; font-weight: 600; }

    /* ---- Motion ---- */
    @keyframes panelIn { from { opacity: 0; transform: translateX(var(--dx, 0)); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes flash { from { background-color: rgba(212, 175, 55, .38); } to { background-color: var(--gold-soft); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
    section[role='tabpanel']:not([hidden]) { animation: panelIn .4s cubic-bezier(.16, 1, .3, 1); }
    .branch.enter { animation: rise .5s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--i, 0) * 60ms); }
    .branch.enter.nearest { animation: rise .5s cubic-bezier(.16, 1, .3, 1) both, flash 1.5s ease-out .4s both; }
    .primary.loading svg { animation: spin 1s linear infinite; }
    .pill { transition: transform .15s, border-color .2s, filter .2s; }
    .pill:hover { transform: translateY(-2px); } .pill:active { transform: scale(.96); }
    .pill.main:hover { filter: brightness(1.08); }
    .action-btn { transition: transform .15s, border-color .2s, background-color .3s; }
    .action-btn:hover { transform: translateY(-2px); }
    .action-btn.done .status-icon { display: inline-block; animation: pop .4s cubic-bezier(.34, 1.56, .64, 1); }
    .icon-btn { transition: color .2s, border-color .2s, transform .3s cubic-bezier(.34, 1.56, .64, 1); }
    .icon-btn:hover { transform: rotate(20deg); } .icon-btn:active { transform: scale(.9); }
    .branch { transition: background-color .3s; } .branch:not(.soon):hover { background: var(--hover); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    /* ---- Touch, selection and focus colors (removes the default blue flash) ---- */
    :root { color-scheme: dark; } html.light-theme { color-scheme: light; }
    * { -webkit-tap-highlight-color: transparent; }
    a, button, .tab, .pill { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
    ::selection { background: var(--gold); color: var(--on-gold); }
    .search:focus, .select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }

    /* ---- Click ripple ---- */
    .primary, .pill, .action-btn, .icon-btn, .link-btn { position: relative; overflow: hidden; }
    .tab { overflow: hidden; }
    .ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .25; pointer-events: none; transform: scale(0); animation: ripple .6s ease-out forwards; }
    @keyframes ripple { to { transform: scale(1); opacity: 0; } }

    /* ---- Theme change: circular reveal (View Transitions) with a color-fade fallback ---- */
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
    ::view-transition-new(root) { z-index: 2; } ::view-transition-old(root) { z-index: 1; }
    html.theme-fade *, html.theme-fade *::before, html.theme-fade *::after { transition: background-color .45s, color .45s, border-color .45s, box-shadow .45s !important; }
    @keyframes iconIn { from { transform: rotate(-90deg) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
    .icon-btn .sun, .icon-btn .moon { animation: iconIn .5s cubic-bezier(.34, 1.56, .64, 1); }
    .branch.nearest.flash { animation: flash 1.6s ease-out .5s both; }

    /* ---- Custom branch dropdown ---- */
    .dd { position: relative; }
    .dd select { display: none; }
    .dd-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 15px 16px; border-radius: 14px; background: var(--chip); color: var(--text); border: 1px solid var(--line); font-weight: 800; font-size: 16px; cursor: pointer; text-align: left; transition: border-color .2s, box-shadow .2s; }
    .dd-btn:hover, .dd.open .dd-btn { border-color: var(--gold); }
    .dd.open .dd-btn { box-shadow: 0 0 0 3px var(--gold-soft); }
    .dd-label { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .dd-label::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft); flex-shrink: 0; }
    .dd-chev { color: var(--gold-text); flex-shrink: 0; transition: transform .3s cubic-bezier(.34,1.4,.64,1); }
    .dd.open .dd-chev { transform: rotate(180deg); }
    .dd-menu { position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 50; list-style: none; max-height: 280px; overflow-y: auto; padding: 6px; background: var(--surface); border: 1px solid var(--gold); border-radius: 16px; box-shadow: 0 18px 40px rgba(0,0,0,.45); opacity: 0; transform: translateY(-8px) scale(.98); transform-origin: top; pointer-events: none; visibility: hidden; transition: opacity .2s, transform .25s cubic-bezier(.16,1,.3,1), visibility .2s; }
    .dd.open .dd-menu { opacity: 1; transform: none; pointer-events: auto; visibility: visible; }
    .dd-group { padding: 10px 12px 4px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-text); }
    .dd-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
    .dd-opt:hover, .dd-opt.active { background: var(--gold-soft); }
    .dd-opt[aria-selected="true"] { color: var(--gold-text); }
    .dd-opt[aria-selected="true"]::after { content: "✓"; font-weight: 800; }
    .dd-opt.disabled { opacity: .5; cursor: not-allowed; }
    .dd-opt.disabled:hover { background: none; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo"><img src="logo.png" alt="" onerror="this.style.display='none'" /></span>RJ Mobile</div>
    <button id="theme" class="icon-btn" type="button" aria-label="Switch between light and dark theme">
      <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <h1 id="h1">Your nearest RJ Mobile, one tap away</h1>
  <p class="lead">Find a branch, call or WhatsApp us, and follow our pages for offers.</p>

  <div class="tabs" id="tabs" data-active="branches" role="tablist">
    <button class="tab" role="tab" id="tab-branches" aria-controls="panel-branches" aria-selected="true" type="button">Branches</button>
    <button class="tab" role="tab" id="tab-connect" aria-controls="panel-connect" aria-selected="false" type="button">Review and follow</button>
  </div>

  <section id="panel-branches" role="tabpanel" aria-labelledby="tab-branches">
    <button id="locate" class="primary" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
      <span id="locate-text">Find my nearest branch</span>
    </button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="cities" class="cities" role="group" aria-label="Filter by city"></div>
    <input id="search" class="search" type="search" placeholder="Search by area, for example Murlipura" aria-label="Search branches" autocomplete="off" />
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty"></p>
  </section>

  <section id="panel-connect" role="tabpanel" aria-labelledby="tab-connect" hidden>
    <div class="card">
      <div class="progress"><span id="prog-text">0/0 done</span><div class="bar"><i id="prog-bar"></i></div></div>
      <div class="dd" id="dd">
        <select id="branch-select" aria-label="Select branch"></select>
        <button type="button" class="dd-btn" id="dd-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="dd-label" id="dd-label"></span>
          <svg class="dd-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <ul class="dd-menu" id="dd-menu" role="listbox"></ul>
      </div>
      <div id="soon" class="soon-card"></div>
      <button id="btn-review" class="action-btn" data-key="review" data-title="Google Maps Review" type="button">
        <div class="btn-content">
          <div class="btn-icon icon-map"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg></div>
          <div class="btn-text"><span class="btn-title">Google Maps Review</span><span class="btn-sub">Review text is copied automatically</span></div>
        </div><span class="status-icon">➔</span>
      </button>
      <div id="manual">
        <p>Automatic copy isn't available on this device. Press and hold the text below to copy it, then tap "Open Google Maps".</p>
        <textarea id="manual-text" readonly></textarea>
        <button type="button" id="manual-go" class="primary">Open Google Maps</button>
      </div>
      <div class="divider"></div>
      <div id="social-list" style="display:contents"></div>
      <button type="button" class="link-btn" id="reset-btn">Reset progress</button>
    </div>
  </section>

  <footer id="footer"></footer>
</div>
<div id="toast" role="status"></div>

<script>
  /* ============ SETTINGS ============ */
  const PHONE = '+919093469093';            // tap-to-call
  const WA_NUMBER = '919093469093';         // WhatsApp (country code + number, no +)
  const OPEN_MIN = 10 * 60, CLOSE_MIN = 22 * 60;   // 10:00 to 22:00 IST
  const DCM_REVIEW_URL = '';                // paste the DCM review link here to enable DCM in the review list
  const BRANCH_CITIES = { jaipur: 'Jaipur', rajgarh: 'Rajgarh', churu: 'Churu' };

  /* ============ BRANCHES (single source for both tabs) ============
     lat/lng are optional: a branch without them is listed but has no distance yet. */

  }
  function setDone(el, on) {
    if (on) doneState[el.dataset.key] = true; else delete doneState[el.dataset.key];
    saveDone(doneState); paintDone(el, on);
    const p = updateProgress();
    if (on && p.total && p.n === p.total) showToast('All steps complete. Thank you! 🎉');
  }
  const restoreDone = () => { allButtons().forEach(el => paintDone(el, !!doneState[el.dataset.key])); updateProgress(); };

  /* ============ REVIEW GENERATOR ============
     Each tap builds a different natural Hinglish review: visit reason (phone / accessories / repair)
     + 1-3 points + closer. Sometimes it mentions how the customer found the shop, and in some reviews
     ONE light keyword line (service + area + city + brand). Recent reviews are remembered. */
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
  const PHONES = ['iPhone', 'Samsung', 'Vivo', 'Oppo', 'Realme', 'OnePlus', 'Redmi', 'new smartphone', 'naya phone'];
  const ACCESSORIES = ['cover', 'tempered glass', 'charger', 'earbuds', 'power bank', 'cable'];
  const EMOJI = ['👍', '🔥', '📱', '😊', '🙌', '💯', '⭐', '👌'];
  const SOURCE_CHANCE = 0.15, KEYWORD_CHANCE = 0.4;
  const SCENARIOS = [
    { w: 4, kw: ['mobile shop', 'mobile showroom', 'mobile phone store'],
      openers: ["{place} me naya {phone} lena tha, RJ Mobile se liya", "phone upgrade karna tha to RJ Mobile {area} visit kiya", "pehle online dekh raha tha {phone}, fir RJ Mobile {area} aaya", "Visited RJ Mobile {area} to buy a {phone}", "RJ Mobile {area} se {phone} liya last week", "dost ke bolne pe RJ Mobile {area} gaya {phone} lene"],
      points: ["staff ne saare models ache se dikhaye, koi pressure nahi diya", "bhaiya ne features samjhaye aur budget ke hisab se hi phone suggest kiya", "purane phone ka data bhi transfer kar diya", "price market se kam laga aur pakka GST bill mila", "exchange me purane phone ki sahi value mili", "EMI process easy tha, zyada paperwork nhi", "original product mila, full warranty ke sath", "showroom saaf suthra h aur latest models available h", "customer service achhi lagi, jaldi kaam ho gya"] },
    { w: 2, kw: ['mobile accessories shop', 'mobile accessories store'],
      openers: ["{accessory} lene gaya tha RJ Mobile {area}", "phone ke liye {accessory} chahiye tha, RJ Mobile {area} se liya", "Bought a {accessory} from RJ Mobile {area}", "{area} me accessories ke liye RJ Mobile try kiya"],
      points: ["bahut saari variety mili, sab brands ke accessories ek hi jagah", "quality original lagi aur rate reasonable the", "staff ne mere phone model ke hisab se sahi fit diya", "tempered glass bhi achhe se laga diya", "bhaiya ne honestly bataya konsa lena chahiye aur konsa nahi", "market se sahi daam me mil gaya"] },
    { w: 2, kw: ['mobile repair shop', 'mobile repairing center', 'mobile repair service'],
      openers: ["phone ki screen toot gayi thi, RJ Mobile {area} me repair karwayi", "mera phone repair karwana tha, RJ Mobile {area} gaya", "battery ki problem thi, RJ Mobile {area} pe dikhaya", "Got my phone repaired at RJ Mobile {area}"],
      points: ["pehle problem check ki fir honest price bataya", "repair jaldi ho gaya, time pe phone mil gaya", "genuine parts use kiye aur warranty bhi mili", "data safe raha, koi tension nhi hui", "phone ab bilkul new jaisa chal raha h", "bina wajah ka extra kharcha nahi karwaya"] }
  ];
  const SOURCES = ["Instagram pe RJ Mobile ki reel dekhi thi", "YouTube shorts me RJ Mobile dekha tha", "Facebook reel dekh ke aaya", "ek dost ne refer kiya tha", "bhai ke recommend karne pe gaya"];
  const KW_LINES = ["best {kw} in {place} - RJ Mobile", "RJ Mobile is a trusted {kw} in {place}", "{kw} in {place} dhundh rahe ho to RJ Mobile try karo", "ek number {kw} in {place}, RJ Mobile"];
  const CLOSERS = ["recommend karunga", "next time bhi yahi se lunga", "family ko bhi yahi bhejunga", "5 star deserve karte h", "thanks RJ Mobile team", "keep it up"];
  const recentReviews = [];
  function weightedScenario() { let r = Math.random() * SCENARIOS.reduce((s, x) => s + x.w, 0); for (const s of SCENARIOS) { if ((r -= s.w) < 0) return s; } return SCENARIOS[0]; }

  function buildReview(branch) {
    const area = branch.name.split(',')[0].trim(), city = BRANCH_CITIES[branch.city] || '';
    const place = (city && city !== area && Math.random() < 0.75) ? area + ', ' + city : area;
    const ctx = { area, city, place, phone: pick(PHONES), accessory: pick(ACCESSORIES) };
    const s = weightedScenario(), parts = [];
    if (Math.random() < SOURCE_CHANCE) parts.push(pick(SOURCES));
    parts.push(pick(s.openers));
    const openerIdx = parts.length - 1;
    if (Math.random() >= 0.2) parts.push(...shuffle(s.points).slice(0, Math.random() < 0.55 ? 2 : 3));
    if (Math.random() < KEYWORD_CHANCE) parts.splice(Math.random() < 0.5 ? openerIdx + 1 : parts.length, 0, pick(KW_LINES).replace('{kw}', pick(s.kw)));
    parts.push(pick(CLOSERS));
    let text = parts.join(Math.random() < 0.6 ? '. ' : ', ').replace(/\{(\w+)\}/g, (m, k) => ctx[k] || '');
    if (Math.random() < 0.5) text = text.charAt(0).toUpperCase() + text.slice(1);
    text = Math.random() < 0.45 ? text.replace(/\.$/, '') : (/[.!]$/.test(text) ? text : text + '.');
    const n = Math.random() < 0.3 ? 0 : (Math.random() < 0.6 ? 1 : 2);
    return n ? text + ' ' + shuffle(EMOJI).slice(0, n).join('') : text;
  }
  function pickReview(branch) {
    let text = '';
    for (let i = 0; i < 15; i++) { text = buildReview(branch); if (!recentReviews.includes(text)) break; }
    recentReviews.push(text); if (recentReviews.length > 25) recentReviews.shift();
    return text;
  }

  /* ============ REVIEW BRANCH PICKER ============ */
  function renderReviewBranches() {
    const select = $('branch-select'), bpn = norm(params.get('branch'));
    let cities = cityList.filter(c => BRANCH_CITIES[c]);
    if (!cities.length && BRANCH_CITIES[bpn]) cities = [bpn];
    const inScope = c => !cities.length || cities.includes(c);
    const list = BRANCHES.filter(b => b.review && inScope(b.city)), soon = UPCOMING.filter(u => inScope(u.city));
    if (!list.length) {
      select.style.display = 'none'; $('btn-review').remove();
      $('soon').innerHTML = '<strong>' + (soon.length ? soon.map(u => u.name).join(', ') + ' branch coming soon' : 'Branches coming soon') + '</strong><span>Reviews will open here once the branch is live. You can follow us on social media meanwhile.</span>';
      $('soon').style.display = 'block';
      return false;
    }
    const opt = (text, id, disabled) => { const o = document.createElement('option'); o.textContent = '📍 ' + text; if (id) o.value = id; o.disabled = !!disabled; return o; };
    const keys = Object.keys(BRANCH_CITIES).filter(k => list.some(b => b.city === k) || soon.some(u => u.city === k));
    keys.forEach(k => {
      const parent = keys.length > 1 ? Object.assign(document.createElement('optgroup'), { label: BRANCH_CITIES[k] }) : select;
      list.filter(b => b.city === k).forEach(b => parent.appendChild(opt(b.name, b.id)));
      soon.filter(u => u.city === k).forEach(u => parent.appendChild(opt(u.name + ' (Coming soon)', '', true)));
      if (parent !== select) select.appendChild(parent);
    });
    if (bpn && !BRANCH_CITIES[bpn]) {
      const hit = list.find(b => norm(b.id) === bpn || b.alias.some(a => norm(a) === bpn) || norm(b.name) === bpn) || (bpn.length >= 3 ? list.find(b => norm(b.name).includes(bpn)) : null);
      if (hit) select.value = hit.id;
    }
    if (select.selectedIndex < 0 || select.options[select.selectedIndex].disabled) select.selectedIndex = Array.from(select.options).findIndex(o => !o.disabled);
    if (list.length === 1 && !soon.length) select.style.display = 'none';
    return true;
  }

  /* ============ CLIPBOARD + REVIEW BUTTON ============ */
  function legacyCopy(text) {
    let ok = false; const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;';
    document.body.appendChild(ta);
    try { ta.contentEditable = 'true'; ta.readOnly = false; const r = document.createRange(); r.selectNodeContents(ta); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ta.setSelectionRange(0, text.length); ta.focus(); ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta); return ok;
  }
  const copyText = text => (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext)
    ? navigator.clipboard.writeText(text).then(() => true).catch(() => legacyCopy(text)) : Promise.resolve(legacyCopy(text));

  let pendingUrl = '';
  const openMaps = url => { location.href = url; };   // same tab, so the Maps app or the logged-in browser handles it
  function doReview() {
    const el = $('btn-review'), branch = BRANCHES.find(b => b.id === $('branch-select').value);
    if (!branch) return;
    const text = pickReview(branch); $('manual').style.display = 'none';
    copyText(text).then(ok => {
      setDone(el, true);
      if (ok) { showToast('Review copied. Paste it on Google Maps.'); setTimeout(() => openMaps(branch.review), 700); }
      else {
        pendingUrl = branch.review; const ta = $('manual-text'); ta.value = text; $('manual').style.display = 'flex';
        ta.focus(); ta.select(); try { ta.setSelectionRange(0, text.length); } catch (e) {}
        showToast("Couldn't copy. Please copy the text below.");
      }
    });
  }

  /* ============ CUSTOM BRANCH DROPDOWN ============ */
  function buildDropdown() {
    const sel = $('branch-select'), dd = $('dd'), btn = $('dd-btn'), menu = $('dd-menu');
    if (sel.options.length < 2) { dd.style.display = 'none'; return; }
    const clean = t => t.replace('📍 ', '');
    const sync = () => {
      $('dd-label').textContent = clean(sel.options[sel.selectedIndex].textContent);
      menu.querySelectorAll('.dd-opt').forEach(li => li.setAttribute('aria-selected', li.dataset.v === sel.value && !li.classList.contains('disabled')));
    };
    const close = () => { dd.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); };
    const addOpt = o => {
      const li = document.createElement('li');
      li.className = 'dd-opt' + (o.disabled ? ' disabled' : '');
      li.setAttribute('role', 'option'); li.dataset.v = o.value;
      li.innerHTML = '<span>' + esc(clean(o.textContent)) + '</span>';
      if (!o.disabled) li.addEventListener('click', () => { sel.value = o.value; sel.dispatchEvent(new Event('change')); sync(); close(); });
      menu.appendChild(li);
    };
    Array.from(sel.children).forEach(ch => {
      if (ch.tagName === 'OPTGROUP') {
        const g = document.createElement('li'); g.className = 'dd-group'; g.textContent = ch.label; menu.appendChild(g);
        Array.from(ch.children).forEach(addOpt);
      } else addOpt(ch);
    });
    btn.addEventListener('click', () => { const o = dd.classList.toggle('open'); btn.setAttribute('aria-expanded', o); });
    document.addEventListener('click', e => { if (!dd.contains(e.target)) close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    sync();
  }

  /* ============ INIT ============ */
  const scopedB = BRANCHES.filter(b => scopeCities.includes(b.city)), scopedU = UPCOMING.filter(u => scopeCities.includes(u.city));
  const footer = scopedB.length + ' branches' + (scopedU.length ? ', ' + scopedU.length + ' more coming soon' : '');
  if (scopeCities.length === 1) $('h1').textContent = 'Your nearest RJ Mobile in ' + BRANCH_CITIES[scopeCities[0]];
  renderCities();
  $('footer').textContent = footer;
  renderBranches();
  renderSocial();
  if (renderReviewBranches()) { buildDropdown(); $('btn-review').addEventListener('click', doReview); }
  else $('dd').style.display = 'none';
  $('manual-go').addEventListener('click', () => openMaps(pendingUrl || (BRANCHES.find(b => b.id === $('branch-select').value) || {}).review));
  $('reset-btn').addEventListener('click', () => { doneState = {}; saveDone(doneState); $('manual').style.display = 'none'; restoreDone(); showToast('Progress has been reset'); });
  restoreDone();
  // Landing tab: ?tab=branches or ?tab=connect wins; otherwise ?city / ?branch / #connect open "Review and follow"
  const tabParam = (params.get('tab') || '').toLowerCase();
  if (tabParam === 'branches') selectTab('branches');
  else if (tabParam === 'connect' || params.has('city') || params.has('branch') || location.hash === '#connect') selectTab('connect');
  window.addEventListener('pageshow', e => { if (e.persisted) { doneState = loadDone(); restoreDone(); renderBranches(); } });
</script>
</body>
